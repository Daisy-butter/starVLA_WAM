run_id: starvla_wan_dit4dit
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: llavavla
is_debug: false
version_id: "0.21"

framework:
  name: WanDit4DiT
  video_loss_weight: 0.1
  world_model:
    base_wm: ./playground/Pretrained_models/Wan-AI/Wan2.2-TI2V-5B-Diffusers
    extract_layers: [-1]
    min_pixel_frames: 5
    feature_extract_tau: 0.5
    num_timestep_buckets: 1000
    freeze_vae: true
    freeze_text_encoder: true
    enable_gradient_checkpointing: true
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Wan-AI/Wan2.2-TI2V-5B-Diffusers
    vl_hidden_dim: 3072
  action_model:
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    repeated_diffusion_steps: 8
    diffusion_model_cfg:
      cross_attention_dim: 512
      num_layers: 16
      output_dim: 1024

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_spatial_dit4dit
    action_type: delta_qpos
    per_device_batch_size: 4
    load_all_data_for_training: true
    video_backend: torchvision_av

trainer:
  max_train_steps: 80000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 500
  learning_rate:
    base: 1.0e-05
    backbone: 1.0e-05
    action_model: 1.0e-04
    wm_projector: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  # Train Video DiT + projector + action head; freeze VAE and text encoder.
  freeze_modules: "backbone.vae,backbone.text_encoder"
  loss_scale:
    vla: 1.0
    video: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
